name: Sync upstream onboarding
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upstream-onboarding
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding
          fetch-depth: 0
      - name: Fast-forward only
        id: sync
        run: |
          git remote add upstream https://github.com/SiebeBaree/hackthefeed.git
          git fetch upstream feat/onboarding
          before=$(git rev-parse HEAD)
          git merge --ff-only upstream/feat/onboarding
          git push origin HEAD:feat/onboarding
          if [ "$before" != "$(git rev-parse HEAD)" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy new upstream version
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK: ${{ secrets.CORVUS_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
